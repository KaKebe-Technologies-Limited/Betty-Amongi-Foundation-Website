<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Upload Photos</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Photos</label>
                        <input type="file" class="form-control" accept="image/*" multiple data-filename-target="#uploadFileName">
                        <div class="form-text" id="uploadFileName">No files chosen</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Category</label>
                        <select class="form-select">
                            <option>Leadership</option>
                            <option>Community Events</option>
                            <option>Youth &amp; Innovation</option>
                            <option>Entrepreneurship</option>
                            <option>Our Regions</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Caption</label>
                        <input type="text" class="form-control" placeholder="Short description">
                    </div>
                </form>
            </div>
            <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-bf-primary">Upload</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
