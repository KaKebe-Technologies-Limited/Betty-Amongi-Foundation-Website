<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CMS Login | Betty Amongi Foundation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../img/baf.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;family=Open+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
<link href="../css/theme-responsive.css" rel="stylesheet">
</head>
<body>

<div class="mm-auth-wrap" style="background: linear-gradient(135deg, var(--bf-primary), var(--bf-secondary));">
    <div class="mm-auth-card">
        <div class="mm-auth-brand">
            <span style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--bf-primary),var(--bf-secondary));display:flex;align-items:center;justify-content:center;"><img src="../img/baf.png" style="width:26px;height:26px;object-fit:contain;" alt=""></span>
            <span class="fw-bold" style="font-family:var(--bf-font-heading); font-size:1.2rem; color:var(--bf-primary);">Foundation <span class="text-bf-accent">CMS</span></span>
        </div>
        <h4 class="text-center mb-1">Content Manager Login</h4>
        <p class="text-muted text-center small mb-4">Manage posts, gallery, and site content.</p>

        <form id="cmsLoginForm">
            <div class="mb-3">
                <label class="form-label">Email or Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                    <input type="text" class="form-control" placeholder="admin@bettyamongifoundation.org">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Not required in this demo">
                    <button class="btn btn-outline-secondary" type="button" id="togglePw"><i class="bi bi-eye"></i></button>
                </div>
                <div class="form-text">Phase 1 demo &mdash; no password check yet.</div>
            </div>
            <button type="submit" class="btn btn-bf-primary btn-lg w-100 mb-3">Login to CMS</button>
        </form>

        <p class="text-center small mt-2 mb-0"><a href="../index.html"><i class="bi bi-arrow-left me-1"></i>Back to Website</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById("togglePw").addEventListener("click", function () {
    var input = this.closest(".input-group").querySelector("input");
    var icon = this.querySelector("i");
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    icon.classList.toggle("bi-eye", !show);
    icon.classList.toggle("bi-eye-slash", show);
});
document.getElementById("cmsLoginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    window.location.href = "dashboard.html";
});
</script>
</body>
</html>
