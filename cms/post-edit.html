<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Post | Foundation CMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../img/baf.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;family=Open+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
<link href="../css/theme-responsive.css" rel="stylesheet">
</head>
<body>
<div class="bf-app">
    <div class="bf-sidebar-backdrop"></div>
    <aside class="bf-sidebar">
        <div class="sidebar-brand"><span class="brand-mark"><img src="../img/baf.png" style="width:22px;height:22px;object-fit:contain;" alt=""></span>Foundation <span class="text-bf-accent">CMS</span></div>
        <div class="nav-section-label">Content Menu</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
            <a class="nav-link active" href="posts.html"><i class="bi bi-file-earmark-post-fill"></i> Blog Posts</a>
            <a class="nav-link" href="gallery.html"><i class="bi bi-images"></i> Gallery</a>
            <a class="nav-link" href="comments.html"><i class="bi bi-chat-square-text-fill"></i> Comments <span class="badge bg-danger rounded-pill ms-auto">3</span></a>
            <a class="nav-link" href="messages.html"><i class="bi bi-envelope-fill"></i> Messages <span class="badge bg-danger rounded-pill ms-auto">5</span></a>
            <a class="nav-link" href="pages.html"><i class="bi bi-file-earmark-richtext-fill"></i> Site Content</a>
        </nav>
        <div class="sidebar-footer"><a class="nav-link px-0" href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a></div>
    </aside>

    <div class="bf-main" style="flex:1; min-width:0; display:flex; flex-direction:column;">
        <header class="bf-topbar" style="background:#fff; border-bottom:1px solid var(--bf-border); padding:0.9rem 1.75rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:1020;">
            <div class="d-flex align-items-center">
                <button class="sidebar-toggle" data-sidebar-toggle style="display:none;"><i class="bi bi-list fs-4"></i></button>
                <h5 class="mb-0 font-heading">Edit Post</h5>
            </div>
            <a href="posts.html" class="btn btn-sm btn-outline-bf-primary">Back to Posts</a>
        </header>

        <main class="bf-content" style="padding:1.75rem; flex:1;">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="bf-card p-4 mb-4">
                        <label class="form-label">Post Title</label>
                        <input type="text" class="form-control form-control-lg mb-3" value="Hon. Betty Amongi Meets Women Leaders in Lira">
                        <label class="form-label">Content</label>
                        <div class="border rounded-3 mb-2 p-2 d-flex gap-1 flex-wrap" style="background:#f8f9fa;">
                            <button type="button" class="btn btn-sm btn-outline-secondary"><i class="bi bi-type-bold"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary"><i class="bi bi-type-italic"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary"><i class="bi bi-link-45deg"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary"><i class="bi bi-list-ul"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary"><i class="bi bi-blockquote-left"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary"><i class="bi bi-image"></i></button>
                        </div>
                        <textarea class="form-control" rows="14">Hundreds of women from across the Lango sub-region gathered in Lira City this week for a community forum on economic empowerment and leadership, hosted in partnership with local district leaders...</textarea>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="bf-card p-4 mb-4">
                        <h6 class="mb-3">Publish</h6>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="bf-badge bf-badge-active">Published</span>
                            <small class="text-muted">12 Jan 2026</small>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-bf-primary">Update Post</button>
                            <button class="btn btn-outline-secondary">Save as Draft</button>
                            <button class="btn btn-outline-danger">Delete Post</button>
                        </div>
                    </div>

                    <div class="bf-card p-4 mb-4">
                        <label class="form-label">Category</label>
                        <select class="form-select mb-3">
                            <option>Leadership</option>
                            <option selected>Women &amp; Girls</option>
                            <option>Entrepreneurship</option>
                            <option>ICT &amp; Innovation</option>
                            <option>Community</option>
                            <option>MentorMe 360</option>
                            <option>Education</option>
                        </select>
                        <label class="form-label">Excerpt</label>
                        <textarea class="form-control" rows="3">Hundreds of women from across the Lango sub-region gathered in Lira City for a community forum on economic empowerment and leadership.</textarea>
                    </div>

                    <div class="bf-card p-4">
                        <h6 class="mb-3">Featured Image</h6>
                        <img src="../img/baf (1).jpeg" class="img-fluid rounded-3 mb-3" alt="">
                        <input type="file" class="form-control" accept="image/*" data-filename-target="#featImgName">
                        <div class="form-text" id="featImgName">baf (1).jpeg</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/site.js"></script>
</body>
</html>
